[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fedllm-tracing"
version = "0.1.0"
description = "Privacy-preserving behavioral provenance tracing for federated LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
    "safetensors>=0.4",
    "scipy>=1.10",
    "torch>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
llm = [
    "accelerate>=1.14,<2",
    "datasets>=5,<6",
    "peft>=0.20,<1",
    "transformers>=5.15,<6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
